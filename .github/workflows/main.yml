name: Build Multi-Platform (self-hosted)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub Release from this run'
        type: boolean
        default: false
jobs:
  tag:
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch' && inputs.release == true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create version tag
        run: |
          $tag = "v1.0.${{ github.run_number }}"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag -a $tag -m "Automated release $tag"
          git push origin $tag
          Write-Host "Created and pushed tag $tag"
  build:
    needs: [tag]
    runs-on: self-hosted
    environment: main
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "& '{0}'"

    strategy:
      matrix:
        platform: [Windows, Linux]

    env:
      UNITY_VERSION: "6000.2.2f1"
      PROJECT_PATH:  ${{ github.workspace }}
      BUILDS_ROOT:   "C:\\Builds"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Compute version from tag or build number
      - name: Compute version
        id: ver
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ github.run_number }}" }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "VERSION = $v"

      # Cache Unity Library using PowerShell compression for Windows runners
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: |
            Library-${{ env.UNITY_VERSION }}-
            Library-
          enableCrossOsArchive: true

      # Make a unique output dir for this run and expose it to later steps
      - name: Compute output dir
        id: paths
        run: |
          $outDir = Join-Path $env:BUILDS_ROOT "CastleOfTime-$env:VERSION-${{ matrix.platform }}"
          "OUT_DIR=$outDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "OUT_DIR = $outDir"

      # (Optional) Ensure the output root exists
      - name: Ensure builds root exists
        run: New-Item -ItemType Directory -Force -Path $env:BUILDS_ROOT | Out-Null

      # Build the updater executables before Unity builds
      - name: Build updater
        run: |
          Write-Host "Building auto-updater for ${{ matrix.platform }}..."
          if (-not (Get-Command dotnet -ErrorAction SilentlyContinue)) {
            Write-Host "❌ .NET SDK not found. Install .NET 6.0+ to build the updater."
            exit 1
          }
          .\Updater\build-updater.ps1 -Platform "${{ matrix.platform }}"
          Write-Host "✅ Updater built successfully"

      # (Optional) Preflight: make sure no GUI editor is locking the project
      - name: Kill stray Unity processes / clear lock
        run: |
          Get-Process -Name "Unity" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name "UnityPackageManager" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $lock = Join-Path $env:PROJECT_PATH "Temp\UnityLockfile"
          if (Test-Path $lock) { Remove-Item $lock -Force -ErrorAction SilentlyContinue }

      # Run your PowerShell build
      - name: Build (${{ matrix.platform }})
        run: .\ci\build.ps1 -UnityVersion $env:UNITY_VERSION -ProjectPath $env:PROJECT_PATH -OutDir $env:OUT_DIR -BuildTarget "${{ matrix.platform }}" -Version $env:VERSION

      # Clean up log files from build output
      - name: Clean up logs
        run: |
          Get-ChildItem -Path $env:OUT_DIR -Filter "*.log" -Recurse | Remove-Item -Force
          Write-Host "Removed all .log files from build output"

      # Zip the build folder
      - name: Zip build
        id: zip
        run: |
          $zipPath = Join-Path $env:BUILDS_ROOT "CastleOfTime-$env:VERSION-${{ matrix.platform }}.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "$env:OUT_DIR\*" -DestinationPath $zipPath
          "ZIP_PATH=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ZIP_PATH = $zipPath"
          
          # Also output for later job consumption
          "zipPath=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # Upload the zipped build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CastleOfTime-${{ env.VERSION }}-${{ matrix.platform }}
          path: ${{ steps.zip.outputs.zipPath }}
          retention-days: 14
          compression-level: 0

      # Upload to itch.io using Butler action
      - name: Upload to itch.io (${{ matrix.platform }})
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          # Install butler if not present
          $butlerPath = "$env:LOCALAPPDATA\Butler\butler.exe"
          if (-not (Test-Path $butlerPath)) {
            Write-Host "Installing butler..."
            $butlerZip = "$env:TEMP\butler.zip"
            $butlerDir = "$env:LOCALAPPDATA\Butler"
            
            # Download butler (allows HTTP redirect)
            Invoke-WebRequest -Uri "https://broth.itch.ovh/butler/windows-amd64/LATEST/archive/default" -OutFile $butlerZip -UseBasicParsing
            
            # Extract
            New-Item -ItemType Directory -Force -Path $butlerDir | Out-Null
            Expand-Archive -Path $butlerZip -DestinationPath $butlerDir -Force
            Remove-Item $butlerZip
            
            Write-Host "Butler installed to $butlerDir"
          }
          
          # Upload to itch.io - push the build folder directly (not zip)
          $channel = "${{ matrix.platform }}".ToLower()
          $itchTarget = "playlastminutegames/castle-of-time:$channel"
          
          Write-Host "Uploading to itch.io: $itchTarget"
          Write-Host "  Build folder: $env:OUT_DIR"
          Write-Host "  Version: $env:VERSION"
          
          # Use --fix-permissions for Linux to preserve executable bits
          $fixPerms = if ("${{ matrix.platform }}" -eq "Linux") { "--fix-permissions" } else { "" }
          
          & $butlerPath push "$env:OUT_DIR" $itchTarget --userversion "$env:VERSION" $fixPerms
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Butler upload failed with exit code: $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          
          Write-Host "Successfully uploaded to itch.io!"

      - name: Collect logs
        if: always()
        run: |
          $logs = Join-Path $env:RUNNER_TEMP "unity-logs-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path $logs | Out-Null

          # Editor & UPM logs (Windows)
          $editor = Join-Path $env:LOCALAPPDATA "Unity\Editor\Editor.log"
          if (Test-Path $editor) { Copy-Item $editor $logs -Force }

          $upm = Join-Path $env:LOCALAPPDATA "Unity\cache\upm\logs"
          if (Test-Path $upm) { Copy-Item $upm $logs -Recurse -Force }

          # Build output logs only (no build files)
          $buildLogs = Join-Path $env:OUT_DIR "*.log"
          if (Test-Path $buildLogs) { 
            Get-ChildItem -Path $env:OUT_DIR -Filter "*.log" | Copy-Item -Destination $logs -Force
          }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Logs-${{ github.run_number }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/unity-logs-${{ matrix.platform }}
          retention-days: 14
          compression-level: 6

  # Create GitHub Release with manifest.json for custom auto-updater
  release:
    runs-on: self-hosted
    needs: build
    if: github.ref_type == 'tag' && needs.build.result == 'success'
    environment: main
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "& '{0}'"
    
    env:
      BUILDS_ROOT: "C:\\Builds"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: CastleOfTime-*-*
          merge-multiple: true
          path: builds
      - name: Compute version from tag
        run: |
          $v = "${{ github.ref_name }}"
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "VERSION = $v"

      - name: Generate manifest.json with SHA256 hashes
        id: manifest
        run: |
          $ver = $env:VERSION
          $repo = "${{ github.repository }}"
          
          # Build URLs for GitHub Releases
          $winZip = "CastleOfTime-$ver-Windows.zip"
          $linZip = "CastleOfTime-$ver-Linux.zip"
          $winUrl = "https://github.com/$repo/releases/download/$ver/$winZip"
          $linUrl = "https://github.com/$repo/releases/download/$ver/$linZip"
          
          # Calculate SHA256 hashes
          $winPath = Join-Path $env:BUILDS_ROOT $winZip
          $linPath = Join-Path $env:BUILDS_ROOT $linZip
          
          if (-not (Test-Path $winPath)) {
            Write-Error "Windows build not found: $winPath"
            exit 1
          }
          if (-not (Test-Path $linPath)) {
            Write-Error "Linux build not found: $linPath"
            exit 1
          }
          
          $winHash = (Get-FileHash $winPath -Algorithm SHA256).Hash.ToLower()
          $linHash = (Get-FileHash $linPath -Algorithm SHA256).Hash.ToLower()
          
          # Build manifest JSON
          $manifest = @{
            version = $ver
            released = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              windows = @{
                url = $winUrl
                sha256 = $winHash
                filename = $winZip
              }
              linux = @{
                url = $linUrl
                sha256 = $linHash
                filename = $linZip
              }
            }
          } | ConvertTo-Json -Depth 5
          
          # Write manifest to file
          $mfPath = Join-Path $env:BUILDS_ROOT "manifest.json"
          $manifest | Out-File $mfPath -Encoding utf8 -NoNewline
          "MANIFEST_PATH=$mfPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          
          Write-Host "Generated manifest.json:"
          Write-Host $manifest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Castle of Time ${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.BUILDS_ROOT }}/CastleOfTime-${{ env.VERSION }}-Windows.zip
            ${{ env.BUILDS_ROOT }}/CastleOfTime-${{ env.VERSION }}-Linux.zip
            ${{ env.MANIFEST_PATH }}
          body: |
            ## Castle of Time ${{ env.VERSION }}
            
            ### Download Options
            
            **For itch.io users:** The itch.io app will automatically download and install this update.
            
            **For standalone installs:** Download the appropriate zip file for your platform:
            - Windows: `CastleOfTime-${{ env.VERSION }}-Windows.zip`
            - Linux: `CastleOfTime-${{ env.VERSION }}-Linux.zip`
            
            The included launcher will automatically check for and download future updates from GitHub Releases.
            
            ### Verification
            SHA256 hashes are included in `manifest.json` for integrity verification.

  notify:
    runs-on: self-hosted
    needs: build
    if: always()
    environment: main
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "& '{0}'"

    steps:
      - name: Send webhook notification
        run: |
          $status = "${{ needs.build.result }}"
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $artifactUrl = "$runUrl#artifacts"
          
          $webhook = "${{ secrets.DISCORD_WEBHOOK_URL }}"
          if ([string]::IsNullOrWhiteSpace($webhook)) {
            Write-Host "No webhook URL configured, skipping notification"
            exit 0
          }
          
          $color = if ($status -eq "success") { 3066993 } else { 15158332 }
          $emoji = if ($status -eq "success") { "Test Build" } else { "Failed Build" }
          
          $commitShort = "${{ github.sha }}".Substring(0, 7)
          $commitUrl = "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          
          $itchUrl = "https://playlastminutegames.itch.io/castle-of-time"
          
          $timestamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
          
          # Build JSON using PSCustomObject and ConvertTo-Json
          $payload = [PSCustomObject]@{
            embeds = @(
              [PSCustomObject]@{
                title = "$emoji CastleOfTime Build #${{ github.run_number }}"
                description = "Multi-platform build $status and uploaded to itch.io"
                url = $itchUrl
                color = $color
                fields = @(
                  [PSCustomObject]@{
                    name = "Status"
                    value = $status
                    inline = $true
                  }
                  [PSCustomObject]@{
                    name = "Platforms"
                    value = "Windows + Linux"
                    inline = $true
                  }
                  [PSCustomObject]@{
                    name = "Commit"
                    value = "[$commitShort]($commitUrl)"
                    inline = $true
                  }
                  [PSCustomObject]@{
                    name = "Play on itch.io"
                    value = $itchUrl
                    inline = $false
                  }
                  [PSCustomObject]@{
                    name = "Download Artifacts"
                    value = "[View Artifacts]($artifactUrl)"
                    inline = $false
                  }
                )
                timestamp = $timestamp
                footer = [PSCustomObject]@{
                  text = "Castle of Time • Last Minute Games"
                }
              }
            )
          }
          
          $json = $payload | ConvertTo-Json -Depth 10 -Compress
          
          try {
            Invoke-RestMethod -Uri $webhook -Method Post -Body ([System.Text.Encoding]::UTF8.GetBytes($json)) -ContentType "application/json; charset=utf-8"
            Write-Host "Webhook sent successfully"
          } catch {
            Write-Host "Failed to send webhook: $_"
            exit 1
          }
