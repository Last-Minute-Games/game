name: Build Multi-Platform (self-hosted)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  tag:
    runs-on: [self-hosted, Linux, ARM64]
    if: ${{ github.ref == 'refs/heads/main' }}
    outputs:
      version: ${{ steps.compute_version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create and compute version tag
        id: compute_version
        run: |
          tag="v1.0.${{ github.run_number }}"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag -a "$tag" -m "Automated release $tag"
          git push origin "$tag"
          echo "Created and pushed tag $tag"
          echo "version=$tag" >> $GITHUB_OUTPUT

  build-windows:
    needs: [tag]
    if: always()
    uses: ./.github/workflows/build-windows.yml
    with:
      unity_version: "6000.3.5f1"
      builds_root: "C:\\Builds"
      version: ${{ needs.tag.outputs.version || github.run_number }}
    secrets: inherit

  build-linux:
    needs: [tag]
    if: always()
    uses: ./.github/workflows/build-linux.yml
    with:
      unity_version: "6000.3.5f1"
      builds_root: "C:\\Builds"
      version: ${{ needs.tag.outputs.version || github.run_number }}
    secrets: inherit

  build-macos:
    needs: [tag]
    if: always()
    uses: ./.github/workflows/build-macos.yml
    with:
      unity_version: "6000.3.5f1"
      version: ${{ needs.tag.outputs.version || github.run_number }}
    secrets: inherit

  release:
    needs: [tag, build-windows, build-linux, build-macos]
    if: ${{ needs.tag.result == 'success' && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' && needs.build-macos.result == 'success' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.tag.outputs.version }}
    secrets: inherit

  notify:
    needs: [build-windows, build-linux, build-macos]
    if: always()
    uses: ./.github/workflows/notify.yml
    with:
      windows_result: ${{ needs.build-windows.result }}
      linux_result: ${{ needs.build-linux.result }}
      macos_result: ${{ needs.build-macos.result }}
    secrets: inherit
  notify:
    needs: [build-windows, build-linux, build-macos]
    if: always()
    uses: ./.github/workflows/notify.yml
    with:
      windows_result: ${{ needs.build-windows.result }}
      linux_result: ${{ needs.build-linux.result }}
      macos_result: ${{ needs.build-macos.result }}
    secrets: inherit
