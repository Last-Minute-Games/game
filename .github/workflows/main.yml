                $output = Get-Content $butlerOutputFile -Raw -ErrorAction SilentlyContinue
                if ($output -match "Use of idled network connection") {
                  Write-Host "  Error: Network connection timeout/idle"
                } elseif ($output -match "timeout") {
                  Write-Host "  Error: Request timeout"
                } elseif ($output -match "connection") {
                  Write-Host "  Error: Network connection issue"
                }
                
                # Show last 50 lines of output for debugging
                Write-Host "Last 50 lines of butler output:"
                Get-Content $butlerOutputFile -Tail 50 -ErrorAction SilentlyContinue
              }
            } catch {
              $lastExitCode = 1
              Write-Host "❌ Upload exception on attempt $attempt" $_
            }
          }
          
          if (-not $uploadSuccess) {
            Write-Host ""
            Write-Host "❌ All upload attempts failed. Last exit code: $lastExitCode"
            Write-Host "Full butler output:"
            Get-Content $butlerOutputFile -ErrorAction SilentlyContinue
            Write-Host "⚠️ Continuing workflow - GitHub release will still be created"
            exit 0
          }
          
          Write-Host ""
          Write-Host "✅ Successfully uploaded to itch.io!"

      - name: Collect logs
        if: always()
        run: |
          $logs = Join-Path $env:RUNNER_TEMP "unity-logs-Linux"
          New-Item -ItemType Directory -Force -Path $logs | Out-Null

          # Editor & UPM logs (Windows)
          $editor = Join-Path $env:LOCALAPPDATA "Unity\Editor\Editor.log"
          if (Test-Path $editor) { Copy-Item $editor $logs -Force }

          $upm = Join-Path $env:LOCALAPPDATA "Unity\cache\upm\logs"
          if (Test-Path $upm) { Copy-Item $upm $logs -Recurse -Force }

          # Build output logs only (no build files)
          $buildLogs = Join-Path $env:OUT_DIR "*.log"
          if (Test-Path $buildLogs) { 
            Get-ChildItem -Path $env:OUT_DIR -Filter "*.log" | Copy-Item -Destination $logs -Force
          }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Logs-${{ github.run_number }}-Linux
          path: ${{ runner.temp }}/unity-logs-Linux
          retention-days: 14
          compression-level: 6

  build-macos:
    needs: [tag]
    if: always()
    runs-on: [self-hosted, Linux, X64]
    environment: main
    defaults:
      run:
        shell: bash
    name: Build macOS (Universal)
    # macOS builds run on Linux x86 runners using bash
    # Unity cross-compiles to build universal binary that works on both Intel 64-bit and Apple Silicon

    env:
      UNITY_VERSION: "6000.2.2f1"
      PROJECT_PATH: ${{ github.workspace }}
      BUILDS_ROOT: "$HOME/Builds"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Compute version from tag or build number
      - name: Compute version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${{ github.ref_name }}"
          else
            v="${{ github.run_number }}"
          fi
          echo "VERSION=$v" >> $GITHUB_ENV
          echo "VERSION = $v"
          
          # Expand $HOME in BUILDS_ROOT if it contains $HOME
          if [[ "$BUILDS_ROOT" == *'$HOME'* ]]; then
            BUILDS_ROOT_EXPANDED="${BUILDS_ROOT/\$HOME/$HOME}"
            echo "BUILDS_ROOT=$BUILDS_ROOT_EXPANDED" >> $GITHUB_ENV
            echo "BUILDS_ROOT = $BUILDS_ROOT_EXPANDED (expanded from $BUILDS_ROOT)"
          else
            echo "BUILDS_ROOT = $BUILDS_ROOT (no expansion needed)"
          fi

      # Cache Unity Library
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Linux-macOS-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: |
            Library-Linux-macOS-${{ env.UNITY_VERSION }}-
            Library-Linux-macOS-
            Library-macOS-
          enableCrossOsArchive: true

      # Make a unique output dir for this run and expose it to later steps
      - name: Compute output dir
        id: paths
        run: |
          outDir="$BUILDS_ROOT/CastleOfTime-$VERSION-macOS"
          echo "OUT_DIR=$outDir" >> $GITHUB_ENV
          echo "OUT_DIR = $outDir"
          echo "BUILDS_ROOT = $BUILDS_ROOT"

      # (Optional) Ensure the output root exists
      - name: Ensure builds root exists
        run: mkdir -p "$BUILDS_ROOT"

      # Build the updater executables before Unity builds (build both architectures for updater)
      - name: Build updater
        run: |
          echo "Building auto-updater for macOS (both x64 and ARM64)..."
          if ! command -v dotnet &> /dev/null; then
            echo "❌ .NET SDK not found. Install .NET 6.0+ to build the updater."
            exit 1
          fi
          chmod +x ./Updater/build-updater.sh
          # Build both architectures for the updater
          ./Updater/build-updater.sh Release macOS x64
          ./Updater/build-updater.sh Release macOS ARM64
          echo "✅ Updater built successfully for both architectures"

      # (Optional) Preflight: make sure no GUI editor is locking the project
      - name: Kill stray Unity processes / clear lock
        run: |
          pkill -x Unity 2>/dev/null || true
          pkill -x UnityPackageManager 2>/dev/null || true
          lock="$PROJECT_PATH/Temp/UnityLockfile"
          if [ -f "$lock" ]; then
            rm -f "$lock"
          fi

      # Verify Unity installation and dependencies
      - name: Verify Unity installation
        run: |
          echo "=== Checking Unity installation ==="
          UNITY="$HOME/Unity/Hub/Editor/$UNITY_VERSION/Editor/Unity"
          UNITY_DIR="$(dirname "$UNITY")"
          
          if [ ! -f "$UNITY" ]; then
            echo "Unity not found at: $UNITY"
            echo "Checking alternative paths..."
            
            # List what's actually installed
            echo "Contents of $HOME/Unity/Hub/Editor/:"
            ls -la "$HOME/Unity/Hub/Editor/" 2>/dev/null || echo "Directory not found"
            
            if [ -d "$HOME/Unity/Hub/Editor/$UNITY_VERSION" ]; then
              echo "Contents of $HOME/Unity/Hub/Editor/$UNITY_VERSION/:"
              ls -la "$HOME/Unity/Hub/Editor/$UNITY_VERSION/" 2>/dev/null || echo "Directory not found"
            fi
            exit 1
          fi
          
          echo "Unity found at: $UNITY"
          echo "File info:"
          file "$UNITY"
          
          echo ""
          echo "=== Setting up Mono environment ==="
          export UNITY_MONO_PATH="$UNITY_DIR/Data/MonoBleedingEdge"
          export LD_LIBRARY_PATH="$UNITY_DIR:$UNITY_DIR/Data/MonoBleedingEdge/lib:${LD_LIBRARY_PATH:-}"
          echo "UNITY_MONO_PATH=$UNITY_MONO_PATH"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
          
          # Check Mono exists
          if [ -d "$UNITY_MONO_PATH" ]; then
            echo "✅ Mono directory found"
            ls -la "$UNITY_MONO_PATH/" | head -10
          else
            echo "❌ Mono directory NOT found at $UNITY_MONO_PATH"
          fi
          
          echo ""
          echo "=== Checking library dependencies ==="
          ldd "$UNITY" 2>&1 | grep -i "not found" || echo "✅ All libraries found"
          
          echo ""
          echo "=== System info ==="
          uname -a
          cat /etc/os-release 2>/dev/null || echo "No os-release file"
          
          echo ""
          echo "=== Testing Unity version ==="
          "$UNITY" -version 2>&1 || echo "Unity -version exited with code: $?"

      # Run your bash build script (build universal binary)
      - name: Build (macOS Universal)
        run: |
          chmod +x ./ci/build.sh
          # Don't pass architecture - build universal binary
          ./ci/build.sh "$UNITY_VERSION" "$PROJECT_PATH" "$OUT_DIR" "macOS" "$VERSION"

      # Clean up log files from build output
      - name: Clean up logs
        run: |
          find "$OUT_DIR" -name "*.log" -type f -delete
          echo "Removed all .log files from build output"
          
          # Remove Unity backup folder that shouldn't be shipped
          find "$OUT_DIR" -type d -name "*BackUpThisFolder_ButDontShipItWithYourGame*" -exec rm -rf {} + 2>/dev/null || true
          echo "Removed Unity backup folder"

      # Zip the build folder
      - name: Zip build
        id: zip
        run: |
          # Expand $HOME in BUILDS_ROOT if it contains $HOME (bash parameter expansion)
          if [[ "$BUILDS_ROOT" == *'$HOME'* ]]; then
            BUILDS_ROOT="${BUILDS_ROOT/\$HOME/$HOME}"
            echo "Expanded BUILDS_ROOT to: $BUILDS_ROOT"
          fi
          
          # Ensure the builds root directory exists
          echo "Creating directory: $BUILDS_ROOT"
          mkdir -p "$BUILDS_ROOT"
          
          zipPath="$BUILDS_ROOT/CastleOfTime-$VERSION-macOS.zip"
          echo "Zip path: $zipPath"
          
          if [ -f "$zipPath" ]; then
            rm -f "$zipPath"
          fi
          
          # Ensure the directory containing the zip file exists (should be same as BUILDS_ROOT, but just in case)
          zipDir=$(dirname "$zipPath")
          echo "Zip directory: $zipDir"
          mkdir -p "$zipDir"
          
          # Verify OUT_DIR exists before trying to zip
          if [ ! -d "$OUT_DIR" ]; then
            echo "❌ Error: OUT_DIR does not exist: $OUT_DIR"
            exit 1
          fi
          
          echo "Changing to OUT_DIR: $OUT_DIR"
          cd "$OUT_DIR"
          
          echo "Creating zip file: $zipPath"
          zip -r "$zipPath" .
          
          if [ $? -eq 0 ]; then
            echo "✅ Zip created successfully"
          else
            echo "❌ Zip creation failed"
            exit 1
          fi
          
          echo "ZIP_PATH=$zipPath" >> $GITHUB_ENV
          echo "ZIP_PATH = $zipPath"
          echo "zipPath=$zipPath" >> $GITHUB_OUTPUT

      # Upload the zipped build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CastleOfTime-${{ env.VERSION }}-macOS
          path: ${{ steps.zip.outputs.zipPath }}
          retention-days: 14
          compression-level: 0

      # Upload to itch.io using Butler (skip in artifact-only mode)
      - name: Upload to itch.io (macOS Universal)
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -e
          
          # Check if butler is installed and in PATH
          if ! command -v butler &> /dev/null; then
            echo "❌ Butler not found in PATH"
            echo "Please install butler on the self-hosted runner and add it to PATH."
            echo "Download from: https://itch.io/docs/butler/installing.html"
            exit 1
          fi
          
          echo "Found butler in PATH"
          
          # Verify butler is working
          echo "Verifying butler installation..."
          if ! butler --version; then
            echo "❌ Butler verification failed"
            exit 1
          fi
          
          # Verify BUTLER_API_KEY is set
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "❌ BUTLER_API_KEY is not set"
            exit 1
          fi
          
          # Verify build directory exists
          if [ ! -d "$OUT_DIR" ]; then
            echo "❌ Build directory does not exist: $OUT_DIR"
            exit 1
          fi
          
          # Calculate build size for logging
          build_size=$(du -sh "$OUT_DIR" | cut -f1)
          file_count=$(find "$OUT_DIR" -type f | wc -l | tr -d ' ')
          echo "Build info:"
          echo "  Size: $build_size"
          echo "  Files: $file_count"
          
          # Upload to itch.io - push the build folder directly (not zip)
          channel="macos"
          itchTarget="playlastminutegames/castle-of-time:$channel"
          
          echo "Uploading to itch.io: $itchTarget"
          echo "  Build folder: $OUT_DIR"
          echo "  Version: $VERSION"
          echo "  Architecture: Universal (Intel 64-bit + Apple Silicon)"
          
          # Retry logic with exponential backoff
          # Disable exit on error for the retry loop
          set +e
          max_attempts=3
          attempt=0
          upload_success=false
          last_exit_code=0
          
          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            echo ""
            echo "=== Upload attempt $attempt of $max_attempts ==="
            
            # Calculate backoff delay (0s, 30s, 60s)
            if [ $attempt -gt 1 ]; then
              backoff=$((30 * (attempt - 1)))
              echo "Waiting ${backoff}s before retry..."
              sleep $backoff
            fi
            
            # Run butler and capture output
            butler push "$OUT_DIR" "$itchTarget" \
              --userversion "$VERSION" \
              --fix-permissions \
              --verbose 2>&1 | tee /tmp/butler-output.log
            last_exit_code=${PIPESTATUS[0]}
            
            if [ $last_exit_code -eq 0 ]; then
              upload_success=true
              echo "✅ Upload succeeded on attempt $attempt"
              break
            else
              echo "❌ Upload failed on attempt $attempt with exit code $last_exit_code"
              
              # Check for specific error patterns
              if grep -q "Use of idled network connection" /tmp/butler-output.log 2>/dev/null; then
                echo "  Error: Network connection timeout/idle"
              elif grep -q "timeout" /tmp/butler-output.log 2>/dev/null; then
                echo "  Error: Request timeout"
              elif grep -q "connection" /tmp/butler-output.log 2>/dev/null; then
                echo "  Error: Network connection issue"
              fi
              
              # Show last 50 lines of output for debugging
              echo "Last 50 lines of butler output:"
              tail -n 50 /tmp/butler-output.log || true
            fi
          done
          
          # Re-enable exit on error
          set -e
          
          if [ "$upload_success" = false ]; then
            echo ""
            echo "❌ All upload attempts failed. Last exit code: $last_exit_code"
            echo "Full butler output:"
            cat /tmp/butler-output.log || true
            echo "⚠️ Continuing workflow - GitHub release will still be created"
            exit 0
          fi
          
          echo ""
          echo "✅ Successfully uploaded to itch.io!"

      - name: Collect logs
        if: always()
        run: |
          logs="$RUNNER_TEMP/unity-logs-macOS"
          mkdir -p "$logs"

          # Editor logs (Linux)
          editor="$HOME/.config/unity3d/Editor.log"
          if [ -f "$editor" ]; then
            cp "$editor" "$logs/"
          fi

          # Alternative editor log location
          editor2="$HOME/.local/share/unity3d/Unity/Editor.log"
          if [ -f "$editor2" ]; then
            cp "$editor2" "$logs/Editor-alt.log"
          fi

          # UPM logs (Linux)
          upm="$HOME/.config/unity3d/cache/upm/logs"
          if [ -d "$upm" ]; then
            cp -r "$upm" "$logs/"
          fi

          # Build output logs only (no build files)
          if [ -d "$OUT_DIR" ]; then
            find "$OUT_DIR" -name "*.log" -type f -exec cp {} "$logs/" \;
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Logs-${{ github.run_number }}-macOS
          path: ${{ runner.temp }}/unity-logs-macOS
          retention-days: 14
          compression-level: 6

  # Create GitHub Release with manifest.json for custom auto-updater
  # Note: Release must run on Windows because butler (itch.io upload tool) doesn't support ARM64
  release:
    runs-on: [self-hosted, Linux, ARM64]
    needs: [tag, build-windows, build-linux, build-macos]
    if: ${{ needs.tag.result == 'success' && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' && needs.build-macos.result == 'success' && github.ref == 'refs/heads/main' }}
    environment: main
    defaults:
      run:
        shell: bash
    
    env:
      BUILDS_ROOT: "C:\\Builds"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: CastleOfTime-*-*
          merge-multiple: true
          path: release-files
          
      - name: Compute version from tag
        run: |
          v="v1.0.${{ github.run_number }}"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "VERSION = $v"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Castle of Time ${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-files/*
          body: |
            ## Castle of Time ${{ env.VERSION }}
            
            ### Download Options
            
            **For itch.io users:** The itch.io app will automatically download and install this update.
            
            **For standalone installs:** Download the appropriate zip file for your platform:
            - Windows: `CastleOfTime-${{ env.VERSION }}-Windows.zip`
            - Linux: `CastleOfTime-${{ env.VERSION }}-Linux.zip`
            - macOS Universal (Intel 64-bit + Apple Silicon): `CastleOfTime-${{ env.VERSION }}-macOS.zip`
            
            The included launcher will automatically check for and download future updates from GitHub Releases.

  notify:
    runs-on: [self-hosted, Linux, ARM64]
    needs: [build-windows, build-linux, build-macos]
    if: always()
    environment: main
    defaults:
      run:
        shell: bash

    steps:
      - name: Send webhook notification
        run: |
          windowsStatus="${{ needs.build-windows.result }}"
          linuxStatus="${{ needs.build-linux.result }}"
          macosStatus="${{ needs.build-macos.result }}"
          
          if [ "$windowsStatus" = "success" ] && [ "$linuxStatus" = "success" ] && [ "$macosStatus" = "success" ]; then
            overallStatus="success"
          else
            overallStatus="failure"
          fi
          
          status="$overallStatus"
          runUrl="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          artifactUrl="$runUrl#artifacts"
          
          webhook="${{ secrets.DISCORD_WEBHOOK_URL }}"
          if [ -z "$webhook" ]; then
            echo "No webhook URL configured, skipping notification"
            exit 0
          fi
          
          if [ "$status" = "success" ]; then
            color="3066993"
            emoji="✅ Build"
          else
            color="15158332"
            emoji="❌ Failed Build"
          fi
          
          commitShort="${GITHUB_SHA:0:7}"
          commitUrl="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          
          itchUrl="https://playlastminutegames.itch.io/castle-of-time"
          
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            description="Multi-platform build $status (artifact only - skipped itch.io)"
          else
            description="Multi-platform build $status and uploaded to itch.io"
          fi
          
          platformsStatus="Windows: $windowsStatus | Linux: $linuxStatus | macOS: $macosStatus"
          
          # Build JSON payload
          json=$(cat <<EOF
          {
            "embeds": [{
              "title": "$emoji CastleOfTime Build #${{ github.run_number }}",
              "description": "$description",
              "url": "$itchUrl",
              "color": $color,
              "fields": [
                {
                  "name": "Status",
                  "value": "$status",
                  "inline": true
                },
                {
                  "name": "Platforms",
                  "value": "Windows + Linux + macOS (x64 + ARM64)",
                  "inline": true
                },
                {
                  "name": "Platform Status",
                  "value": "$platformsStatus",
                  "inline": false
                },
                {
                  "name": "Commit",
                  "value": "[$commitShort]($commitUrl)",
                  "inline": true
                },
                {
                  "name": "Play on itch.io",
                  "value": "$itchUrl",
                  "inline": false
                },
                {
                  "name": "Download Artifacts",
                  "value": "[View Artifacts]($artifactUrl)",
                  "inline": false
                }
              ],
              "timestamp": "$timestamp",
              "footer": {
                "text": "Castle of Time • Last Minute Games"
              }
            }]
          }
          EOF
          )
          
          response=$(curl -s -w "\n%{http_code}" -X POST "$webhook" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$json")
          
          http_code=$(echo "$response" | tail -n1)
          if [ "$http_code" = "200" ] || [ "$http_code" = "204" ]; then
            echo "Webhook sent successfully"
          else
            echo "Failed to send webhook (HTTP $http_code)"
            echo "$response" | head -n-1
            exit 1
          fi
